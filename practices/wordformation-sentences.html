<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>WordFormation Sentences</title><style>
:root{--purple:#6d28d9;--blue:#2563eb;--paper:#f7f7fb;--good:#15803d;--bad:#dc2626}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--paper);color:#1f2937}header{background:linear-gradient(135deg,#6d28d9,#2563eb);color:white;padding:28px 20px;text-align:center}header h1{margin:0;font-size:clamp(2rem,5vw,3.5rem)}header p{margin:10px 0 0}.container{max-width:1000px;margin:35px auto;padding:0 16px}.back{display:inline-block;margin-bottom:22px;color:var(--purple);font-weight:bold;text-decoration:none}.score{font-size:1.1rem;font-weight:bold;background:#ede9fe;color:#5b21b6;padding:10px 15px;border-radius:999px}.exercise-head{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:20px;flex-wrap:wrap}.question,.rights-card{background:white;border-radius:16px;padding:22px;margin:15px 0;box-shadow:0 5px 18px #0000000d}.qhead{font-size:1.05rem;font-weight:600;line-height:1.55;margin-bottom:10px}.base{display:inline-block;background:#ede9fe;color:#5b21b6;padding:5px 10px;border-radius:999px;font-size:13px;font-weight:bold;margin:4px}.answer-row{display:flex;gap:8px;align-items:center}input{padding:12px;border:2px solid #d8d8df;border-radius:9px;font-size:16px;width:min(100%,420px)}button{border:0;border-radius:10px;padding:12px 18px;background:var(--purple);color:white;font-size:15px;font-weight:bold;cursor:pointer}.secondary{background:#475569}.correct{border-color:var(--good)!important;background:#f0fdf4}.wrong{border-color:var(--bad)!important;background:#fef2f2}.feedback{font-size:14px;font-weight:bold}.correct-text{color:var(--good)}.wrong-text{color:var(--bad)}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:25px 0 50px}.rights-card{line-height:2.1;font-size:1.08rem}.inline-input{width:150px;max-width:100%;padding:8px 10px;margin:0 4px;vertical-align:middle}.inline-check{padding:8px 11px;margin-left:3px;font-size:13px}@media(max-width:600px){.answer-row{flex-direction:column;align-items:stretch}.answer-row input{width:100%}.question,.rights-card{padding:17px}}
</style></head><body><header><h1>WordFormation Sentences</h1><p>Complete each gap with the correct form of the word in brackets.</p></header><main class="container"><a class="back" href="../index.html">← Back to all practices</a><div class="exercise-head"><h2>Practice</h2><div id="score" class="score">Score: 0 / 40</div></div><div id="questions"></div><div class="actions"><button onclick="checkAll()">Check All Answers</button><a class="back" href="../index.html">← Back to Practices</a></div></main><script>const questions=[{"sentence":"How long is the __________ from Rome to Paris?","base":"FLY","answers":["flight"]},{"sentence":"I have a very good __________ with both my parents.","base":"RELATION","answers":["relationship"]},{"sentence":"Pulling my front tooth didn’t hurt. It was completely __________.","base":"PAIN","answers":["painless"]},{"sentence":"I can tell from your __________ that you’re not really happy.","base":"EXPRESS","answers":["expression"]},{"sentence":"We offer free __________ for purchases over €100.","base":"DELIVER","answers":["delivery"]},{"sentence":"James hasn’t had a lot of __________ lately, so I hope he’ll do well with his new company.","base":"SUCCEED","answers":["success"]},{"sentence":"It is __________ colder today than it was yesterday.","base":"CERTAIN","answers":["certainly"]},{"sentence":"What __________ is he? Spanish or Portuguese?","base":"NATION","answers":["nationality"]},{"sentence":"You have the __________. You can either go by bus or walk.","base":"CHOOSE","answers":["choice"]},{"sentence":"My best friend has a great __________.","base":"PERSON","answers":["personality"]},{"sentence":"You need a lot of __________ to write a good story.","base":"IMAGINE","answers":["imagination"]},{"sentence":"The lesson was __________. I almost fell asleep.","base":"BORE","answers":["boring"]},{"sentence":"Don’t be so __________. This is the second vase you have broken this month.","base":"CARE","answers":["careless"]},{"sentence":"It’s simply __________. I have won the lottery.","base":"BELIEVE","answers":["unbelievable"]},{"sentence":"I have to hold a __________ at my brother’s wedding.","base":"SPEAK","answers":["speech"]},{"sentence":"There’s a lot of __________ about that on the internet.","base":"INFORM","answers":["information"]},{"sentence":"The children were very __________ when the teacher came in.","base":"NOISE","answers":["noisy"]},{"sentence":"The film was a bit __________. I didn’t really understand what happened.","base":"CONFUSE","answers":["confusing"]},{"sentence":"He has to wear these gloves for __________ reasons.","base":"SAFE","answers":["safety"]},{"sentence":"Sally was __________ for two years before she found a new job.","base":"EMPLOY","answers":["unemployed","employed"]},{"sentence":"In India, there are a lot of __________ in the streets.","base":"BEG","answers":["beggars"]},{"sentence":"When I gave up smoking I started putting on more __________.","base":"WEIGH","answers":["weight"]},{"sentence":"I had no __________ in finding the right street.","base":"DIFFICULT","answers":["difficulty"]},{"sentence":"He talked about __________ and peace in our world.","base":"FREE","answers":["freedom"]},{"sentence":"__________, I was invited to watch the new film.","base":"LUCKY","answers":["luckily"]},{"sentence":"The __________ of our rainforests is a serious problem.","base":"DESTROY","answers":["destruction"]},{"sentence":"Animals in a zoo don’t live in their __________ environment.","base":"NATURE","answers":["natural"]},{"sentence":"__________ does not have anything to do with how much money you have.","base":"HAPPY","answers":["happiness"]},{"sentence":"Thank you for being so __________ yesterday.","base":"HELP","answers":["helpful"]},{"sentence":"He has been a long-__________ runner for a few years now.","base":"DISTANT","answers":["distance"]},{"sentence":"Don’t you think it’s too __________ for you to go sailing in such weather?","base":"DANGER","answers":["dangerous"]},{"sentence":"This is my last __________. Don’t walk across the lawn!","base":"WARN","answers":["warning"]},{"sentence":"He gave me some good __________ on where to go shopping.","base":"ADVISE","answers":["advice"]},{"sentence":"If you want to complain about the product, please go to the __________.","base":"MANAGE","answers":["management","manager"]},{"sentence":"The new flat is not __________. It’s too expensive.","base":"AFFORD","answers":["affordable"]},{"sentence":"John is six years old. He’s very __________ and full of life.","base":"ACT","answers":["active"]},{"sentence":"My mother spent her __________ in France.","base":"CHILD","answers":["childhood"]},{"sentence":"I have made a few __________ to your article.","base":"CORRECT","answers":["corrections"]},{"sentence":"Every child should get a good __________.","base":"EDUCATE","answers":["education"]},{"sentence":"Listen carefully to the __________ before you go out!","base":"INSTRUCT","answers":["instructions"]}];function norm(v){return v.trim().toLowerCase().replace(/\s+/g,' ')}function mark(el,f,ok){el.className=ok?'correct':'wrong';f.textContent=ok?'✓ Correct':'✗ Try again';f.className='feedback '+(ok?'correct-text':'wrong-text');}function checkOne(i){const e=document.getElementById('a'+i),f=document.getElementById('f'+i);if(!e.value.trim()){f.textContent='Enter an answer';f.className='feedback wrong-text';return}mark(e,f,questions[i].answers.map(norm).includes(norm(e.value)));updateScore();}function updateScore(){let s=questions.filter((q,i)=>q.answers.map(norm).includes(norm(document.getElementById('a'+i).value))).length;document.getElementById('score').textContent=`Score: ${s} / ${questions.length}`;}function checkAll(){questions.forEach((_,i)=>checkOne(i));}document.getElementById('questions').innerHTML=questions.map((q,i)=>`<div class="question"><div class="qhead">${i+1}. ${q.sentence}</div><span class="base">(${q.base})</span><div class="answer-row"><input id="a${i}" placeholder="Your answer" autocomplete="off"><button onclick="checkOne(${i})">Check</button><span id="f${i}" class="feedback"></span></div></div>`).join('');</script></body></html>
