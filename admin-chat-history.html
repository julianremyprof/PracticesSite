<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chat history · RaisingDiamonds</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0"></script><style>body{margin:0;background:#f5f6f8;color:#1d1d1f;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{width:min(1120px,calc(100% - 32px));margin:35px auto}.layout{display:grid;grid-template-columns:360px 1fr;gap:16px}.panel{background:white;border:1px solid #e1e5ea;border-radius:18px;padding:18px;min-height:500px}.list{display:grid;gap:8px;max-height:70vh;overflow:auto}.item{padding:12px;border:1px solid #e2e5e9;border-radius:12px;background:white;text-align:left;cursor:pointer}.item.active{border-color:#176bc0;background:#eef6ff}.item b,.item small{display:block}.item small{color:#697583;margin-top:4px}.messages{display:flex;flex-direction:column;gap:10px;max-height:70vh;overflow:auto}.msg{max-width:80%;padding:10px 13px;border-radius:13px;background:#f0f3f6;overflow-wrap:anywhere}.msg.mine{align-self:flex-end;background:#e7f1fc}.msg small{display:block;color:#6a7480;margin-top:5px;text-align:right}.status{color:#697583}@media(max-width:750px){.layout{grid-template-columns:1fr}.panel{min-height:280px}}</style></head><body><main><a href="dashboard.html">← Dashboard</a><h1>Chat history</h1><p class="status">Administrator view · Review conversation history. Messages are read-only here.</p><div class="layout"><section class="panel"><h2>Conversations</h2><div class="list" id="list">Loading…</div></section><section class="panel"><h2 id="title">Select a conversation</h2><div class="messages" id="messages">Choose a conversation to review its messages.</div></section></div></main><script src="assets/practice-auth.js?v=20261112-1"></script><script>
(async()=>{const db=window.englishLabSupabase||window.supabase.createClient('https://kehopukcypesrecyfrvp.supabase.co','sb_publishable_zDWMioaroblLV0cRMh-SoQ_RvGYnCE6'),$=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const auth=await db.auth.getUser();if(!auth.data.user){location.href='student-login.html';return}const me=auth.data.user;const pr=await db.from('profiles').select('account_type').eq('id',me.id).single();if(pr.error||pr.data.account_type!=='admin'){document.body.innerHTML='<main><h1>Administrator access required</h1></main>';return}const [tc,cc]=await Promise.all([db.from('teacher_conversations').select('id,teacher_id,student_id,created_at').order('created_at',{ascending:false}),db.from('community_conversations').select('id,participant_a,participant_b,created_at').order('created_at',{ascending:false})]);if(tc.error||cc.error)throw tc.error||cc.error;const conversations=[...(tc.data||[]).map(x=>({...x,kind:'teacher'})),...(cc.data||[]).map(x=>({...x,kind:'peer'}))];const ids=[...new Set(conversations.flatMap(c=>c.kind==='teacher'?[c.teacher_id,c.student_id]:[c.participant_a,c.participant_b]))];const profiles=ids.length?await db.from('profiles').select('id,full_name,account_type').in('id',ids):{data:[]};if(profiles.error)throw profiles.error;const names=Object.fromEntries((profiles.data||[]).map(p=>[p.id,p.full_name]));let active=null;function render(){ $('list').innerHTML=conversations.map(c=>{const a=c.kind==='teacher'?c.teacher_id:c.participant_a,b=c.kind==='teacher'?c.student_id:c.participant_b;return '<button class="item '+(active?.id===c.id?'active':'')+'" data-id="'+c.id+'"><b>'+esc(names[a]||'Account')+' ↔ '+esc(names[b]||'Account')+'</b><small>'+(c.kind==='peer'?'Student chat':'Teacher–student chat')+' · '+new Date(c.created_at).toLocaleString()+'</small></button>'}).join('')||'<p>No conversations yet.</p>';document.querySelectorAll('[data-id]').forEach(b=>b.addEventListener('click',()=>open(b.dataset.id)));}async function open(id){active=conversations.find(c=>c.id===id);render();const peer=active.kind==='teacher'?[active.teacher_id,active.student_id]:[active.participant_a,active.participant_b];$('title').textContent=(names[peer[0]]||'Account')+' ↔ '+(names[peer[1]]||'Account');const table=active.kind==='teacher'?'teacher_messages':'community_messages';const r=await db.from(table).select('sender_id,body,created_at').eq('conversation_id',id).order('created_at',{ascending:true}).limit(1000);if(r.error){$('messages').textContent=r.error.message;return}$('messages').innerHTML=(r.data||[]).map(m=>'<article class="msg '+(m.sender_id===me.id?'mine':'')+'"><div>'+esc(m.body)+'</div><small>'+esc(names[m.sender_id]||'Account')+' · '+new Date(m.created_at).toLocaleString()+'</small></article>').join('')||'No messages in this conversation.';}$('list').addEventListener('keydown',()=>{});render();})().catch(e=>{document.querySelector('main').insertAdjacentHTML('beforeend','<p class="status">'+String(e.message||e)+'</p>')});
</script></body></html>
