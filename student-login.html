<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f6f8"><title>Student access · English Lab</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 15% 10%,#e2eaff,transparent 35%),#f5f6f8;color:#171a22;font:16px/1.55 Inter,system-ui,sans-serif}.shell{width:min(100%,520px)}.brand{display:flex;align-items:center;gap:10px;margin-bottom:24px;color:#171a22;text-decoration:none;font-weight:850}.mark{display:grid;place-items:center;width:36px;height:36px;border-radius:12px;background:#111827;color:#fff}.card{padding:clamp(24px,6vw,42px);border:1px solid #e0e4eb;border-radius:26px;background:#fff;box-shadow:0 22px 70px #18233d12}.eyebrow{color:#2457e6;font-size:.75rem;font-weight:850;letter-spacing:.14em;text-transform:uppercase}h1{margin:8px 0;font-size:2.25rem;letter-spacing:-.06em}p{color:#667085}.tabs,.switch{display:flex;gap:8px;margin:24px 0 18px}.tabs button,.switch button{flex:1;padding:11px;border:1px solid #e0e4eb;border-radius:12px;background:#f5f6f8;color:#475467;font-weight:750;cursor:pointer}.tabs button.active,.switch button.active{background:#edf2ff;border-color:#a8bcff;color:#1744bd}label{display:block;margin:14px 0 6px;font-size:.85rem;font-weight:750;color:#344054}input,select{width:100%;height:48px;padding:0 13px;border:1px solid #cbd3df;border-radius:11px;background:white;font:inherit}input:focus,select:focus{outline:3px solid #2457e633;border-color:#2457e6}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.primary{width:100%;height:50px;margin-top:20px;border:0;border-radius:999px;background:#2457e6;color:#fff;font:inherit;font-weight:800;cursor:pointer}.primary:disabled{opacity:.6}.message{min-height:25px;margin:14px 0 0;font-size:.9rem}.message.error{color:#b42318}.message.success{color:#137b4b}.back{display:block;margin:18px 0;color:#2457e6;text-decoration:none;font-weight:750}small{display:block;margin-top:13px;color:#7a8493} [hidden]{display:none!important}@media(max-width:460px){.grid{grid-template-columns:1fr}}
</style></head><body><main class="shell"><a class="brand" href="index.html"><span class="mark">E</span>English Lab</a><section class="card"><div class="eyebrow">Student portal</div><h1>Your learning, in one place.</h1><p>Sign in to save practice results and follow your progress.</p>
<div class="tabs"><button type="button" class="active" data-mode="login">Sign in</button><button type="button" data-mode="register">Create account</button></div>
<form id="authForm" novalidate>
<div id="loginMethod"><div class="switch"><button type="button" class="active" data-method="email">Email</button><button type="button" data-method="username">Username</button></div>
<div id="emailLoginField"><label for="emailLogin">Email address</label><input id="emailLogin" type="email" autocomplete="username"></div>
<div id="usernameLoginField" hidden><label for="usernameLogin">Username</label><input id="usernameLogin" autocomplete="username" minlength="3"></div>
<label for="passwordLogin">Password</label><input id="passwordLogin" type="password" autocomplete="current-password" required>
</div>
<div id="registerFields" hidden>
<label for="fullName">Full name</label><input id="fullName" autocomplete="name" maxlength="100">
<label for="username">Choose a username</label><input id="username" autocomplete="username" minlength="3" maxlength="24" placeholder="e.g. alex.r">
<label for="email">School or personal email</label><input id="email" type="email" autocomplete="email">
<label for="password">Create password</label><input id="password" type="password" minlength="8" autocomplete="new-password">
<div class="grid"><div><label for="prom">Prom</label><select id="prom"><option value="2026">2026</option><option value="2027">2027</option><option value="2028">2028</option><option value="2029">2029</option></select></div><div><label for="shift">Shift</label><select id="shift"><option value="AM">AM</option><option value="PM">PM</option></select></div></div>
<small>Your Prom and shift help organize class progress reports.</small>
</div>
<button class="primary" id="authSubmit" type="submit">Sign in</button><div id="authMessage" class="message" role="status" aria-live="polite"></div>
</form><a class="back" href="index.html">← Back to the practice library</a></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/auth.js"></script></body></html>
