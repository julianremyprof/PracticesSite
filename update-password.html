<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f5f6f8">
<title>Reset password · RaisingDiamonds</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 15% 10%,#e2eaff,transparent 35%),#f5f6f8;color:#171a22;font:16px/1.55 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.card{width:min(100%,480px);padding:clamp(24px,6vw,40px);border:1px solid #e0e4eb;border-radius:24px;background:#fff;box-shadow:0 22px 70px #18233d12}.eyebrow{color:#2457e6;font-size:12px;font-weight:850;letter-spacing:.14em;text-transform:uppercase}h1{margin:9px 0;font-size:34px;letter-spacing:-.06em}p{color:#667085}.field{display:block;margin:18px 0 7px;color:#344054;font-size:13px;font-weight:750}input{width:100%;height:48px;padding:0 13px;border:1px solid #cbd3df;border-radius:11px;font:inherit}input:focus{outline:3px solid #2457e633;border-color:#2457e6}.button{width:100%;height:49px;margin-top:20px;border:0;border-radius:999px;background:#2457e6;color:#fff;font:inherit;font-weight:800;cursor:pointer}.button:disabled{opacity:.6}.message{min-height:24px;margin-top:14px;font-size:14px;color:#667085}.message.error{color:#b42318}.message.success{color:#137b4b}.back{display:inline-block;margin-top:18px;color:#2457e6;text-decoration:none;font-weight:750}[hidden]{display:none!important}
</style>
</head>
<body>
<main class="card">
  <div class="eyebrow">RaisingDiamonds · Account security</div>
  <h1>Choose a new password.</h1>
  <p>Use at least 8 characters and include at least one number or special character. Temporary-password users must change it before continuing.</p>
  <form id="resetForm" hidden>
    <label class="field" for="newPassword">New password</label>
    <input id="newPassword" type="password" minlength="8" maxlength="128" autocomplete="new-password" required>
    <label class="field" for="confirmPassword">Confirm new password</label>
    <input id="confirmPassword" type="password" minlength="10" maxlength="128" autocomplete="new-password" required>
    <button class="button" id="savePassword" type="submit">Save new password</button>
  </form>
  <p id="resetMessage" class="message" role="status" aria-live="polite">Checking your secure reset link…</p>
  <a class="back" href="student-login.html">Return to sign in</a>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const client=window.supabase.createClient("https://kehopukcypesrecyfrvp.supabase.co","sb_publishable_zDWMioaroblLV0cRMh-SoQ_RvGYnCE6");
const form=document.getElementById("resetForm"),message=document.getElementById("resetMessage"),save=document.getElementById("savePassword");
let recoveryReady=false;
let forcedChange=false;
function showReady(isForced=false){recoveryReady=true;forcedChange=isForced;form.hidden=false;message.textContent=isForced?"You must choose a new password before accessing RaisingDiamonds.":"Your reset link is valid. Choose a new password.";message.className="message";}
client.auth.onAuthStateChange((event,session)=>{
  if(event==="PASSWORD_RECOVERY"&&session)showReady(false);
});
(async()=>{
  try{
    const params=new URLSearchParams(window.location.search);
    const force=params.get("force")==="1";
    const hashParams=new URLSearchParams(window.location.hash.replace(/^#/,""));
    const isRecovery=hashParams.get("type")==="recovery";
    const {data:{session},error}=await client.auth.getSession();
    if(error)throw error;
    if(force){
      if(session?.user?.app_metadata?.must_change_password===true)showReady(true);
      else if(session){message.textContent="No password change is pending for this account. Return to sign in.";message.className="message";}
      else{message.textContent="Sign in with your temporary password first. You will be redirected here to choose a new password.";message.className="message error";}
    }else if(session&&isRecovery){showReady(false);}
    else if(!recoveryReady){message.textContent="This reset link is invalid or has expired. Return to sign in and ask the administrator to send another link.";message.className="message error";}
  }catch(error){message.textContent=error.message||"Unable to verify this reset link.";message.className="message error";}
})();
form.addEventListener("submit",async event=>{
  event.preventDefault();
  const password=document.getElementById("newPassword").value;
  const confirmation=document.getElementById("confirmPassword").value;
  if(password.length<8||!/[0-9]|[^A-Za-z0-9]/.test(password)){
    message.textContent="Use at least 8 characters and include at least one number or special character.";
    message.className="message error";return;
  }
  if(password!==confirmation){message.textContent="The passwords do not match.";message.className="message error";return;}
  save.disabled=true;message.textContent="Saving your new password…";message.className="message";
  try{
    if(!recoveryReady)throw new Error("Your reset link or sign-in session is no longer valid. Sign in again or request a new link.");
    const {error}=await client.auth.updateUser({password});
    if(error)throw error;
    if(forcedChange){
      const {data,error:completeError}=await client.functions.invoke("admin-set-temporary-password",{body:{action:"complete_password_change"}});
      if(completeError)throw completeError;
      if(data?.error)throw new Error(data.error);
    }
    await client.auth.signOut();
    form.hidden=true;
    message.textContent="Password updated successfully. You can now sign in with your new password.";
    message.className="message success";
  }catch(error){message.textContent=error.message||"Could not update your password.";message.className="message error";}
  finally{save.disabled=false;}
});
</script>
</body>
</html>
